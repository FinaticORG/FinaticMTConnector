name: Auto Version and Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version segment to increment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: finatic-mt-connector-auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version-and-tag:
    name: Validate reviewed version and create tag
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify reviewed develop checkout
        shell: bash
        run: |
          git fetch --no-tags origin develop
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/develop)" ]]; then
            echo "Release tags must be created from the current remote develop tip."
            exit 1
          fi

      - name: Calculate next semantic version
        id: next-version
        shell: bash
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump }}
        run: |
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            latest_tag="v0.1.0"
          fi
          latest_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$latest_version"
          bump_type="$BUMP_TYPE"
          if [[ ! "$bump_type" =~ ^(patch|minor|major)$ ]]; then
            echo "Bump type must be patch, minor, or major."
            exit 1
          fi
          if [[ "$bump_type" == "major" ]]; then
            next_version="$((major + 1)).0.0"
          elif [[ "$bump_type" == "minor" ]]; then
            next_version="${major}.$((minor + 1)).0"
          else
            next_version="${major}.${minor}.$((patch + 1))"
          fi
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "next_tag=v$next_version" >> "$GITHUB_OUTPUT"

      - name: Validate reviewed release version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pyproject_path = Path("pyproject.toml")
          pyproject_text = pyproject_path.read_text(encoding="utf-8")
          version_match = re.search(
              r'^version = "([0-9]+\.[0-9]+\.[0-9]+)"$',
              pyproject_text,
              flags=re.MULTILINE,
          )
          if version_match is None:
              raise RuntimeError("Unable to locate project version in pyproject.toml")
          reviewed_version = version_match.group(1)
          expected_version = "${{ steps.next-version.outputs.next_version }}"
          if reviewed_version != expected_version:
              raise RuntimeError(
                  f"Reviewed version {reviewed_version} does not match next tag {expected_version}; "
                  "align package and EA versions in a reviewed PR before tagging"
              )
          PY

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        shell: bash
        run: |
          git tag -a "${{ steps.next-version.outputs.next_tag }}" -m "Finatic MT Connector ${{ steps.next-version.outputs.next_tag }}"
          git push origin "${{ steps.next-version.outputs.next_tag }}"

      - name: Record explicit artifact-build handoff
        shell: bash
        run: |
          {
            echo "Tag ${{ steps.next-version.outputs.next_tag }} now points to $(git rev-parse HEAD)."
            echo "Run Build and Release EA Artifacts with release_tag=${{ steps.next-version.outputs.next_tag }}."
            echo "Publication still requires clean MT4/MT5 compile logs, complete checksums/provenance, and dual-platform signed staging acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
