name: Build and Release EA Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - Auto Version and Tag
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finatic-mt-connector-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Publish EA source artifacts
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MT4_SOURCE_PATH: src/finatic_mt_connector/ea_reference/mt4/FinaticMT4ConnectorEA.mq4
      MT5_SOURCE_PATH: src/finatic_mt_connector/ea_reference/mt5/FinaticMT5ConnectorEA.mq5
      DIST_DIRECTORY: dist/ea
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            release_tag="${{ github.ref_name }}"
          else
            git fetch --tags
            release_tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          fi
          if [[ -z "$release_tag" ]]; then
            echo "Unable to resolve release tag."
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          git checkout "$release_tag"

      - name: Collect EA source artifacts
        shell: bash
        run: |
          mkdir -p "$DIST_DIRECTORY"
          cp "$MT4_SOURCE_PATH" "$DIST_DIRECTORY/FinaticMT4ConnectorEA.mq4"
          cp "$MT5_SOURCE_PATH" "$DIST_DIRECTORY/FinaticMT5ConnectorEA.mq5"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd "$DIST_DIRECTORY"
          sha256sum FinaticMT4ConnectorEA.mq4 FinaticMT5ConnectorEA.mq5 > checksums.sha256

      - name: Build release notes
        shell: pwsh
        run: |
          $releaseNotesPath = "$env:GITHUB_WORKSPACE\$env:DIST_DIRECTORY\release-notes.md"
          $tagName = "${{ steps.release-tag.outputs.release_tag }}"
          $changelogItems = git log --oneline -n 15
          @"
          ## Finatic MT Connector $tagName

          ### Included artifacts
          - FinaticMT4ConnectorEA.mq4
          - FinaticMT5ConnectorEA.mq5
          - checksums.sha256

          ### Verification
          Download `checksums.sha256` and validate with:

          ```bash
          sha256sum -c checksums.sha256
          ```

          ### Recent changes
          $changelogItems
          "@ | Out-File -FilePath $releaseNotesPath -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finatic-ea-artifacts-${{ steps.release-tag.outputs.release_tag }}
          path: ${{ env.DIST_DIRECTORY }}

      - name: Publish GitHub release
        if: steps.release-tag.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.release_tag }}
          generate_release_notes: true
          body_path: ${{ env.DIST_DIRECTORY }}/release-notes.md
          files: ${{ env.DIST_DIRECTORY }}/*
