name: Finatic MT Connector CI

on:
  pull_request:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finatic-mt-connector-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run CI-fast checks
        run: uv run poe ci-fast
