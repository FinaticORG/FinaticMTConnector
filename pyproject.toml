[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "finatic-mt-connector"
version = "0.1.5"
description = "Customer-hosted MT4/MT5 connector contracts and reference implementation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.138.2",
  "pydantic>=2.13.4",
  "typing-extensions>=4.15.0",
  "orjson>=3.11.9",
  "poethepoet>=0.47.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finatic_mt_connector"]

[tool.pytest.ini_options]
addopts = "--color=yes --strict-config --strict-markers --verbosity=2"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
fix = true
line-length = 80
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true

[tool.poe.executor]
type = "simple"

[tool.poe.tasks.lint]
help = "Lint this package"
cmd = "python -m ruff check src tests"

[tool.poe.tasks.typecheck]
help = "Run static type checks"
cmd = "python -m mypy src"

[tool.poe.tasks.syntax-check]
help = "Run Python syntax checks"
cmd = "python -m compileall -q src"

[tool.poe.tasks.format-check]
help = "Run formatting checks"
cmd = "python -m ruff format src tests --check"

[tool.poe.tasks.test-fast]
help = "Run fast test suite used by CI"
cmd = "python -m pytest tests -m \"not integration\""

[tool.poe.tasks.ci-fast]
help = "Run canonical fast CI checks"
sequence = [
  { cmd = "python -m ruff check src tests" },
  { cmd = "python -m mypy src" },
  { cmd = "python -m compileall -q src" },
  { cmd = "python -m ruff format src tests --check" },
  { cmd = "python -m pytest tests -m \"not integration\"" },
]

[tool.poe.tasks.release-local]
help = "Run local Windows binary release preparation (no push)"
cmd = "powershell -ExecutionPolicy Bypass -File scripts/release/local_release.ps1 -Bump patch"

[tool.poe.tasks.release-local-publish]
help = "Run local Windows binary release preparation and publish"
cmd = "powershell -ExecutionPolicy Bypass -File scripts/release/local_release.ps1 -Bump patch -Publish"
