[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "finatic-mt-connector"
version = "0.1.1"
description = "Customer-hosted MT4/MT5 connector contracts and reference implementation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.6",
  "pydantic>=2.11.0",
  "typing-extensions>=4.12.0",
  "orjson>=3.10.0",
  "poethepoet>=0.32.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14.1",
  "pre-commit>=4.0.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finatic_mt_connector"]

[tool.pytest.ini_options]
addopts = "--color=yes --strict-config --strict-markers --verbosity=2"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
fix = true
line-length = 80
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true

[tool.poe.executor]
type = "simple"

[tool.poe.tasks.lint]
help = "Lint this package"
cmd = "python -m ruff check src tests"

[tool.poe.tasks.typecheck]
help = "Run static type checks"
cmd = "python -m mypy src"

[tool.poe.tasks.syntax-check]
help = "Run Python syntax checks"
cmd = "python -m compileall -q src"

[tool.poe.tasks.format-check]
help = "Run formatting checks"
cmd = "python -m ruff format src tests --check"

[tool.poe.tasks.test-fast]
help = "Run fast test suite used by CI"
cmd = "python -m pytest tests -m \"not integration\""

[tool.poe.tasks.ci-fast]
help = "Run canonical fast CI checks"
sequence = [
  { cmd = "python -m ruff check src tests" },
  { cmd = "python -m mypy src" },
  { cmd = "python -m compileall -q src" },
  { cmd = "python -m ruff format src tests --check" },
  { cmd = "python -m pytest tests -m \"not integration\"" },
]
